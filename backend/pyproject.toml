[project]
name = "erp-shopee-backend"
version = "0.1.0"
description = "ERP Shopee — backend FastAPI (multi-tenant, FIFO, kits, precificacao)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
